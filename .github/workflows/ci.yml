
name: Loan Prediction CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and evaluate Loan Prediction model
        run: python loan_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated unit tests
        run: python -m unittest discover -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loan-prediction-ml-artifacts
          path: |
            loan_model.pkl
            metrics.json
            loan_prediction.csv
          if-no-files-found: error
          retention-days: 7

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp loan_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          printf "Loan Prediction Application\nRun: python app.py\nHealth endpoint: GET /\nPrediction endpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: loan-prediction-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
