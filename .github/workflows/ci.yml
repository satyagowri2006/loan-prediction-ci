
name: Loan Prediction CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-containerize:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and evaluate Loan Prediction model
        run: python loan_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated unit tests
        run: python -m unittest discover -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Build Docker image
        run: docker build -t loan-prediction-api:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name loan-prediction-ci-container \
            -p 5000:5000 \
            loan-prediction-api:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done

          echo "Application did not become ready."
          docker logs loan-prediction-ci-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"Gender":"Male","Married":"Yes","Dependents":"0","Education":"Graduate","Self_Employed":"No","ApplicantIncome":5000,"CoapplicantIncome":0,"LoanAmount":150,"Loan_Amount_Term":360,"Credit_History":1,"Property_Area":"Urban"}' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs loan-prediction-ci-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f loan-prediction-ci-container || true

      - name: Upload validated ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loan-prediction-ml-artifacts
          path: |
            loan_model.pkl
            metrics.json
            loan_prediction.csv
          if-no-files-found: error
          retention-days: 7

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp loan_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          printf "Loan Prediction Application\nRun: python app.py\nHealth endpoint: GET /\nPrediction endpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: loan-prediction-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
